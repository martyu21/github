name: Deploy spoke infrastructure to Development

on:
  push:
    branches:
      - '**'    
      - '!main'

jobs:

  terraform:
    runs-on: self-hosted
    environment:
      name: DEV

    strategy:
      fail-fast: false
      matrix:
        spoke: [
          eastside
        ]

    env:
      TF_VAR_access_key: ${{ secrets.ACCESS_KEY }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      TF_VAR_vm_pool: "dev-pool"
      TF_VAR_container_pool: "dev-pool"
      TF_VAR_environment: "dev"
      PM_USER: ${{ secrets.PROXMOX_USER }}
      PM_PASSWORD: ${{ secrets.PROXMOX_PASSWORD }}    

    steps:

      - name: Checkout github user repo
        uses: actions/checkout@v4
        with:
          path: user_repo
          depth: 0

      - name: Checkout terraform_proxmox repo
        uses: actions/checkout@v4
        with:
          repository: martyu21/terraform_proxmox
          path: proxmox

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: proxmox/proxmox
        run: terraform init -upgrade -backend-config="key=${{ matrix.spoke }}/dev/state.tfstate"

      - name: Select workspace for spoke
        run: |
          terraform -chdir=proxmox/proxmox workspace new "${{ matrix.spoke }}" || true
          terraform -chdir=proxmox/proxmox workspace select "${{ matrix.spoke }}"

      - name: Terraform Plan
        run: |
          for file in user_repo/org/spoke/${{ matrix.spoke }}/*.tfvars; do
            abs_file="$(realpath "$file")"
            planfile="$(basename "$file" .tfvars).tfplan"

            echo "Planning $abs_file..."
            terraform -chdir=proxmox/proxmox plan \
              -out="$planfile" \
              -var-file="$abs_file"
          done

      - name: Terraform Apply
        if: success()
        env:
          TF_LOG: DEBUG
          TF_LOG_PATH: terraform-debug.log
        run: |
          for file in user_repo/org/spoke/${{ matrix.spoke }}/*.tfvars; do
            planfile="$(basename "$file" .tfvars).tfplan"

            echo "Applying $planfile..."
            terraform -chdir=proxmox/proxmox apply \
              -auto-approve \
              "$planfile"
          done

      - name: Read container IDs
        id: container_ids
        run: |
          ids=$(terraform -chdir=proxmox/proxmox output -raw container_ids_csv)
          echo "ids=$ids" >> $GITHUB_OUTPUT

      - name: Start Containers via API
        run: |
          AUTH=$(curl -sk \
            --data-urlencode "username=${PM_USER}" \
            --data-urlencode "password=${PM_PASSWORD}" \
            https://192.168.1.87:8006/api2/json/access/ticket)

          echo "Auth Response:"
          echo "$AUTH"

          TICKET=$(echo "$AUTH" | jq -r '.data.ticket')
          CSRF=$(echo "$AUTH" | jq -r '.data.CSRFPreventionToken')

          IFS=',' read -ra IDS <<< "${{ steps.container_ids.outputs.ids }}"

          for ID in "${IDS[@]}"; do

            echo "Starting CT $ID"

            RESPONSE=$(curl -sk \
              -w "\nHTTP_STATUS:%{http_code}\n" \
              -b "PVEAuthCookie=$TICKET" \
              -H "CSRFPreventionToken: $CSRF" \
              -X POST \
              "https://192.168.1.87:8006/api2/json/nodes/westside/lxc/${ID}/status/start")

            echo "$RESPONSE"

          done


      - name: Show Terraform Outputs
        run: |
          terraform -chdir=proxmox/proxmox output

      - name: Read vm_pool from Terraform
        id: pool
        run: |
          pool=$(terraform -chdir=proxmox/proxmox output -raw vm_pool)
          echo "vm_pool=$pool" >> $GITHUB_OUTPUT

      - name: Read hostnames from Terraform
        id: hostnames
        run: |
          hostnames=$(terraform -chdir=proxmox/proxmox output -raw hostnames)
          echo "hostnames=$hostnames" >> $GITHUB_OUTPUT

      - name: Debug Outputs
        run: |
          echo "vm_pool = ${{ steps.pool.outputs.vm_pool }}"
          echo "hostnames = ${{ steps.hostnames.outputs.hostnames }}"

      - name: Health Check
        if: success()
        run: |
          IFS=',' read -ra HOSTS <<< "${{ steps.hostnames.outputs.hostnames }}"

          for HOST in "${HOSTS[@]}"; do

            echo "================================"
            echo "Checking http://$HOST.${{vars.domainname}}/${{vars.healthcheck_path}}"
            echo "================================"

            PASSED=false

            for i in {1..30}; do

              if curl --fail --silent --show-error "http://$HOST.${{vars.domainname}}/${{vars.healthcheck_path}}" > /dev/null; then
                echo "✅ PASS - $HOST"
                PASSED=true
                break
              fi

              echo "Attempt $i/30 failed"
              sleep 10

            done

            if [ "$PASSED" = false ]; then
              echo "❌ FAIL - $HOST"
              exit 1
            fi

          done

          echo "✅ All health checks passed"



      - name: Destroy DEV resources
        if: steps.pool.outputs.vm_pool == 'dev-pool'
        run: |
          for file in user_repo/org/spoke/${{ matrix.spoke }}/*.tfvars; do
            abs_file="$(realpath "$file")"
            echo "Destroying using $abs_file..."
            terraform -chdir=proxmox/proxmox destroy -auto-approve -var-file="$abs_file"
          done
