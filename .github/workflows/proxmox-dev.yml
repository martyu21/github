name: Deploy spoke infrastructure to Development

on:
  push:
    branches:
      - '**'    
      - '!main'

jobs:

  terraform:
    runs-on: self-hosted
    environment:
      name: DEV

    strategy:
      fail-fast: false
      matrix:
        spoke: [
          eastside
        ]

    env:
      TF_VAR_access_key: ${{ secrets.ACCESS_KEY }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      TF_VAR_vm_pool: "dev-pool"
      TF_VAR_container_pool: "dev-pool"
      TF_VAR_environment: "dev"            

    steps:

      - name: Checkout github user repo
        uses: actions/checkout@v4
        with:
          path: user_repo
          depth: 0

      - name: Checkout terraform_proxmox repo
        uses: actions/checkout@v4
        with:
          repository: martyu21/terraform_proxmox
          path: proxmox

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: proxmox/proxmox
        run: terraform init -backend-config="key=${{ matrix.spoke }}/dev/state.tfstate"

      - name: Select workspace for spoke
        run: |
          terraform -chdir=proxmox/proxmox workspace new "${{ matrix.spoke }}" || true
          terraform -chdir=proxmox/proxmox workspace select "${{ matrix.spoke }}"

      - name: Terraform Plan
        run: |
          for file in user_repo/org/spoke/${{ matrix.spoke }}/*.tfvars; do
            abs_file="$(realpath "$file")"
            planfile="$(basename "$file" .tfvars).tfplan"

            echo "Planning $abs_file..."
            terraform -chdir=proxmox/proxmox plan \
              -out="$planfile" \
              -var-file="$abs_file"
          done

      - name: Terraform Apply
        if: success()
        run: |
          for file in user_repo/org/spoke/${{ matrix.spoke }}/*.tfvars; do
            planfile="$(basename "$file" .tfvars).tfplan"

            echo "Applying $planfile..."
            terraform -chdir=proxmox/proxmox apply \
              -auto-approve \
              "$planfile"
          done

      - name: Show Terraform Outputs
        run: |
          terraform -chdir=proxmox/proxmox output

      - name: Read vm_pool from Terraform
        id: pool
        run: |
          pool=$(terraform -chdir=proxmox/proxmox output -raw vm_pool)
          echo "vm_pool=$pool" >> $GITHUB_OUTPUT

      - name: Read hostnames from Terraform
        id: hostnames
        run: |
          hostnames=$(terraform -chdir=proxmox/proxmox output -raw hostnames)
          echo "hostnames=$hostnames" >> $GITHUB_OUTPUT

      - name: Debug Outputs
        run: |
          echo "vm_pool = ${{ steps.pool.outputs.vm_pool }}"
          echo "hostnames = ${{ steps.hostnames.outputs.hostnames }}"

      - name: Health Check
        if: success()
        run: |
          IFS=',' read -ra HOSTS <<< "${{ steps.hostnames.outputs.hostnames }}"

          for HOST in "${HOSTS[@]}"; do

            echo "================================"
            echo "Checking http://$HOST/"
            echo "================================"

            PASSED=false

            for i in {1..30}; do

              if curl --fail --silent --show-error "http://$HOST/1234" > /dev/null; then
                echo "✅ PASS - $HOST"
                PASSED=true
                break
              fi

              echo "Attempt $i/30 failed"
              sleep 10

            done

            if [ "$PASSED" = false ]; then
              echo "❌ FAIL - $HOST"
              exit 1
            fi

          done

          echo "✅ All health checks passed"



      - name: Destroy DEV resources
        if: steps.pool.outputs.vm_pool == 'dev-pool'
        run: |
          for file in user_repo/org/spoke/${{ matrix.spoke }}/*.tfvars; do
            abs_file="$(realpath "$file")"
            echo "Destroying using $abs_file..."
            terraform -chdir=proxmox/proxmox destroy -auto-approve -var-file="$abs_file"
          done
